<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>RubCub — Rubik’s Cube Solver</title>
  <meta name="description" content="Scan a 3x3 Rubik’s cube with your camera and solve it step by step on an animated 3D cube. Works offline." />
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="color-scheme" content="dark light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="RubCub" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <meta property="og:title" content="RubCub — Rubik’s Cube Solver" />
  <meta property="og:description" content="Scan your cube with the camera and solve it step by step in 3D." />
  <meta property="og:image" content="./icons/icon-512.png" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <style>
    /* Painted before the JS loads, so there is no white flash on start. */
    html { background: #0b0b0f; }
    @media (prefers-color-scheme: light) { html { background: #f6f5f2; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <noscript>RubCub needs JavaScript to run.</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
