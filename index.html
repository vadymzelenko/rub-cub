<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>Cube Solver</title>
  <style>
    :root {
      --bg: #0A0A0A;
      --surface: #141414;
      --surface-2: #1C1C1C;
      --text: #EDEDED;
      --muted: #888888;
      --border: #262626;
      --accent: #3B82F6;
      --accent-dim: #1D4ED8;
      --danger: #EF4444;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: var(--bg);
      overflow: hidden;
      overscroll-behavior: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    /* Canvas layers: Phaser (UI/nav) below, Three.js (cube) composited above via transparent bg */
    #phaser-root { position: absolute; inset: 0; z-index: 1; }
    #camera-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
      display: none;
    }
    #loading-screen {
      position: fixed; inset: 0; z-index: 999;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.02em;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <video id="camera-video" autoplay playsinline muted></video>
    <div id="phaser-root"></div>
  </div>
  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-label">Загрузка…</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
