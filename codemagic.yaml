workflows:
  android-debug:
    name: RubCub
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 17
      android: 34
      vars:
        PACKAGE_NAME: "dev.vzstudio.rubcub"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Build web app
        script: |
          npm run build
      - name: Add Android platform (if missing)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build Android debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - zelenko009@gmail.com
        notify:
          success: true
          failure: true
